# On-prem stack for a dedicated Ubuntu server (not the events Dell).
# Bind to localhost so only Cloudflare Tunnel (or LAN if you change bind) can reach it.
# Usage:
#   cp .env.onprem.example .env.onprem
#   ./scripts/deploy-onprem.sh

name: urban-planning-onprem

services:
  web:
    image: urban-planning-web:latest
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${ONPREM_BIND_ADDR:-127.0.0.1}:${ONPREM_WEB_PORT:-80}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
