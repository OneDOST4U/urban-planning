server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/geo+json
    application/xml
    image/svg+xml
    font/woff2
    application/font-woff;

  location = /favicon.svg {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location = /lasam-logo.png {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /data/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /markers/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
